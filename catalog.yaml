  - id: minimax
    name: MiniMax Code
    aliases: [mm, minimaxcode]
    vendor: MiniMax
    unit: credit
    grant_type: accumulating
    daily_amount: 400
    validity_days: 30
    cap: null
    claim_policy: always
    claim_mode: ui
    command: ""
    streak:
      cycle_days: 7
      bonus_on: [4, 7]
      bonus_amount: 1000
      mode: set_daily
    capabilities: [coding, multimodal]
    open_when_needed: false
    notes: "签到卡在主页左下角（每日签到/今天@400/第4天@1000）。【2026-09-26 起改为 external 直签：全自动、不依赖客户端运行、不开窗口】端点 GET/POST /minimax-cloud/api/v1/signin/{status,claim}，host=https://agent.minimax.cn，鉴权 Authorization: Bearer（读本机明文凭据 C:\\Users\\Hunter\\.minimax\\auth\\prod\\cn\\mcode-public\\auth.json；token 不进命令行、不进日志、不进输出）。**必须带 timezone_id=Asia/Shanghai**：缺失时 HTTP 仍 200 但业务返回 1406010011 invalid timezone_id；只有 IANA 名有效，8 / +8 / 28800 / Shanghai 全被拒。已签判定用 days 里 is_today 且 status=3(Claimed)，以服务端为准不重复领取（2026-09-26 实测幂等）。【2026-09-27 修正·最终】弃用 UI 路线的旧理由「无法冷启动（只起 updater.exe、主进程不出现）」已被实测推翻；而更早的「打开瞬间关掉/客户端崩溃」是**沙箱内的假象**——在沙箱里用 ShellExecuteW 拉起的进程会在沙箱命令返回后被回收（误判为崩溃），**客户端本身不崩**。真实约束：本自动化会话只能以 runas（提权）拉起 GUI 客户端，非提权从会话启动根本不起进程（与 TraeWork/AutoClaw 同一套路；每次 runas 弹一次 UAC，需主人批准，漏批则静默失败）。真正的大坑是**冷启动渲染延迟**：全新拉起的（提权）MiniMax 主窗口最初是白屏，要等约 12s 内容才渲染出来，过早 OCR/截图只会看到标题栏而找不到「每日签到」卡。修复：窗口出现后 `Start-Sleep 12` 再 OCR/点击（与 GPU、WebGPU 无关，`--disable-gpu` 无效已移除）。external 直签仍被过期 token 阻断（expiresAt 2026-09-26 00:24、无刷新端点记录）；UI/OCR 路线现已可用（2026-09-27 实测 ok 并入账 400）。失效条件：token 过期（脚本会打印剩余小时）、端点改路径、timezone 校验变更、UAC 漏批导致启动失败。此前「isTrusted 过滤」只对 UIA InvokePattern 成立，OS 级注入与 external 都不受影响，不要再拿它当否决理由。"
    models_note: "MiniMax-M3 / M2.7 / H3"

  - id: traework
    name: TraeWork
    aliases: [trae, 字节trae]
    vendor: 字节跳动
    unit: credit
    grant_type: accumulating
    daily_amount: 150
    validity_days: 31
    cap: null
    claim_policy: always
    claim_mode: ui
    command: ""
    extra_monthly: 500
    capabilities: [coding]
    open_when_needed: false
    notes: "【2026-09-28 起改全自动：claim_mode=ui，由每日计划任务提权跑 scripts/ui_claim_traework.ps1（OCR 定位+点击，9-27 实测 +150 成功）；签完只关闭本次由脚本拉起的实例，主人已开着的保留】TraeWork(TRAE SOLO CN) 与 TraeCode(Trae CN) 是同一套签到：out\\main.js 大小只差 3 字节，共用 POST https://api.trae.cn/trae/api/v2/ug/checkin_credits/{status,claim}（body={req_source:1}），主人已确认两者共享积分账户 -> 台账只保留 traework，不新增 traecode，避免重复计数。【规则 2026-09-26 双方自述 + 官方页确认】免费 150/天、会员 200/天，有效期 31 自然日（FIFO），每月登录赠 500 当月有效；**无连签周期、无连签加成**（官方「月最高 6200」= 200x31 纯线性，响应体无 streak 字段，只有 credits/extra_credits/beijingDayKey）。【为什么是 manual】鉴权头为 Authorization: Cloud-IDE-JWT <token>，token 只存在于 Electron 主进程内存（源自 %APPDATA%\\<产品>\\User\\globalStorage\\storage.json 里加密的 iCubeAuthInfo），按硬规则 6 不解密 -> external 拿不到凭据；本环境冷启动两个客户端都失败（ShellExecuteW 返回 42 但 45s 无进程）-> UI 路线也不可全自动；它自带定时任务（左栏「自动化」，须选本地环境）能定时唤起 agent，但 agent 在隔离 V8 无 fetch，只能靠电脑控制点击界面，且**每次运行自身消耗积分**，日收益 150 未必覆盖，故未启用。入口：桌面端左下角头像 → 菜单「签到」按钮（云端开关 checkinMenuEnabled 控制，网页/手机端无入口）。【OCR 脚本 2026-09-27 实测成功】scripts/ui_claim_traework.ps1 + run_traework_claim.py（提权 runas，--explore 只抓布局 / --dry-run 只定位 / --shots 截图诊断）。**提权才能冷启动客户端**（未提权 ShellExecuteW 起不来，推翻此前"必须手动打开"结论）。四个实测坑：①签到按钮文案是「每日领150积分」不是「签到」，且 OCR 拆成单字（每/日/领/150/积/分）-> 必须连续词拼接匹配；②菜单是 toggle，多候选点轮流点击会互相关掉 -> 每点一次多轮检测，失败先 ESC 再换点；③「每日领150积分」是说明文字，真按钮是右侧黑底白字「签到」（OCR 漏检黑底白字）-> 点文字行起点右偏 ~380px（窗口尺寸大变需重调，--shots 可快速重调）；④账户条上方有「会员¥39」推广卡片。已签态文案「本账号今日已签到，明日再来」。2026-09-27 实测 ok 并入账 150。失效条件：端点/鉴权变更、菜单文案服务端改版导致偏移失准、或客户端结构大改。"
    models_note: "16+ 模型，CUE / MCP"

  - id: autoclaw
    name: AutoClaw 智谱
    aliases: [claw, 智谱, zhipu]
