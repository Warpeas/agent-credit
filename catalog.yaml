      review: "额度中等（150/天）但 31 天有效期 + 每月登录赠 500，16+ 模型与 MCP 支持是优势。领取靠提权 UI + OCR 点击，窗口改版即失效，是五家里最脆的一环。与 TraeCode 共用同一积分账户，别重复计数。"
      best_for: "需要多模型切换、MCP 工具链的编码任务"
