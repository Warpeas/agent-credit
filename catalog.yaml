    notes: "Qoder CN 桌面端（Electron，进程名 'Qoder CN'，exe 在 %LOCALAPPDATA%\\Programs\\Qoder CN\\Qoder CN.exe，数据目录 ~/.qoder-cn）。【2026-10-13 主人确认 + 本机实测】有每日签到活动：弹窗「专属活动权益 / 立即查收」里的「每天领 100 Credits」，**每日 10:00 (UTC+8) 刷新，领取后 30 天有效，+100**。两种触发路径：①客户端启动时自动弹窗；②左下角用户名右侧的「用量」仪表图标 → 弹出「我的用量」小窗 → 点小窗里的礼盒图标 → 出现该活动弹窗 → 点「领取」。【机制来源，resources/app.asar 只读反编译】活动内容是服务端下发进 webview 的，bundle 里搜不到「专属活动权益/每天领」等文案（命中 0），且「签到」二字在 bundle 里也命中 0——早期据此误判为「无签到」，已由主人纠正。客户端有 ICampaignService，轮询 GET /sash/api/v1/me/campaigns/{id}/limited-number 取 {showCampaign, claimable}，CAMPAIGN_REFRESH_INTERVAL_MS≈1h，claimable 时左下角礼盒图标带 halo（campaign-claimable-indicator-halo）；领取动作在 webview 内点「领取」触发。【为什么 UI 而非 external】~/.qoder-cn/.auth 下无明文凭据（只有 machine_id 与 dynamic-texts 缓存），登录态不在明文里；按 research/SAFETY.md 不解密登录态 → external 拿不到凭据，故走客户端自身界面的 OCR + OS 级点击（与 AutoClaw/TraeWork/LobsterAI 同路）。【UIA 不可达】主窗口 UIA 树仅 13 个元素、无任何领取相关 Name（实测），活动层是 webview，UIA 看不见 → 必须 OCR。【实跑打通，2026-10-13 经每日计划任务(InteractiveToken+Highest)多轮验证，已实测领到】scripts/ui_claim_qodercn.ps1 全程**锚点定位、不写死坐标**（本机 200% 缩放且窗口在最大化/还原间变）：抓图用 CopyFromScreen(窗口矩形)；每条路径都现找目标。关键结论与踩坑：① **点击必须用 SendInput**，`mouse_event` 对 Qoder 的 webview 点不动（窗口纹丝不动）；且点击只在**真实交互桌面**（计划任务/用户终端）生效，agent 子进程里点不动。② 两条领取路径都跑通：**启动弹窗**（情况一，直接找领取）；**已打开时**点底栏「用量仪表」→「我的用量」小窗→「礼盒」→ 应用内活动弹窗（不是 Edge，之前误判是点到了「查看详情」）。③ 底栏图标/礼盒/领取全是无文字或黑底白字，OCR 读不出：用量仪表以**用户名文字为锚向右找图标像素簇**；礼盒以**「查看详情」文字左缘为锚、往左跨最大空白找窄图标簇**（按钮填充是宽簇、礼盒是窄簇）；**领取按钮用「中央区高密度中性黑块」定位**（黑底白字，OCR 读不出；要求中性黑以排除深绿「查看详情」）。④ 领取成功后按钮变灰「不可领取」——幂等判定认「不可领取/已领取」文案，不依赖黑药丸（否则领取后会误点到底部「查看详情」拉 Edge）。⑤ 致命 PowerShell 坑：`Log()` 用 `Write-Output` 会污染函数返回值（Find-BlackPill 里 Log 后返回，导致返回值变成日志字符串、被当成命中的按钮，算出 sx=-13 乱点）；Log 必须写 stderr/文件，不能用 Write-Output。⑥ 聊天面板满是「领取/礼盒/签到」关键词（脚本跑在 IDE 内）→ 领取只认黑药丸、不信 OCR 词。实测：10:08 点领取后按钮 领取→不可领取，已 `credit record qodercn claimed 100` 落账（连签1、剩余100）。失效条件：活动服务端下线/改额度/改刷新时间、弹窗文案或布局改版、账户条/用量小窗布局变化。⚠️ 待主人核对：Qoder 里 +100 Credits 是否确实到账（「不可领取」副文案是「活动已结束或不符合领取条件」的兜底语，需确认是「已领」而非「未领成」）。【2026-10-14 实测纠正】弹窗上的倒计时与「每日 10:00 (UTC+8) 刷新」**不是领取窗口限制**：当天 00:53 主人手动点「领取」立即成功（按钮 领取→领取中→已领取），凌晨即可领，10:00 前不存在服务端拒发。10-14 凌晨自动漏签的真实根因是编排层冷启动后只等 3s 就跑 ps1（主窗口 ~4s 后才出现 → notfound），已修为 Python 侧 + ps1 侧各 90s 轮询等窗口、成功后关闭本次冷启动实例；继续由**唯一的统一计划任务 agent-credit-checkin（00:05 全量 checkin）**领取，不为 Qoder 单独建任务。另再次确认：agent 子进程里的 SendInput 点击对该 webview 不生效（坐标/前台均正确但弹窗纹丝不动），真实交互桌面（计划任务/人点）才生效。【2026-10-16 主人报告 UI 改版】①启动时自动弹窗仍在；②新路径：点左下角用户名 → 展开菜单有「权益中心」→ 点击后仍弹出同一活动浮窗；③旧路径失效：左下角「用量」icon 下的礼品 icon 已移除（「我的用量」小窗不再有礼盒入口）。→ ui_claim_qodercn.ps1 的 path② 锚点（用户名右侧仪表 → 小窗礼盒）已废，需改为「用户名 → 权益中心」；当日 00:08 自动跑 pending（窗口最小化 rect=-32000 且底栏锚点未命中），待主人手签后 record。【2026-10-16 当日修复完成】ui_claim_qodercn.ps1 已重写：path② 改为「Esc 关浮层 → 点用户名文字中心 → 左侧菜单『权益中心』（OCR 跨字短语；限定左 1/3 区且在用户名上方，防聊天面板同名词误命中，最多两次重试）→ 同一活动浮窗 → 黑药丸领取」；删除旧礼盒/绿块路径（旧 Find-Gift 在新小窗里把暗簇误判成礼盒乱点）；幂等判定加弹窗标记门控（必须先命中『专属活动权益/立即查收/每天领』才认『已领取/不可领取』，因主人常在 Qoder 里聊签到脚本，聊天区常年有这些词）；Find-QoderWindow 过滤最小化位置(-32000)与 <600x400 的辅助窗口（00:08 pending 的另一根因：选中了 314x50 辅助窗）。交互桌面计划任务实测两轮全通过：08:48 情况一（启动弹窗）领取成功，按钮变灰『已领取』、文案『领取成功，Credits 已到账』；08:56 关掉弹窗后情况二（用户名→权益中心）走查成功，再次运行正确返回 already 不重复领。已 record qodercn claimed 100（连签4、余400，与客户端资源包余额一致）。【2026-10-20 修：情况二锚点静默失效一整天，根因是 PS 5.1 的 Sort-Object 字符串属性名对哈希表数组不生效】10-20 00:02 定时轮情况二 pending：点用户名后找不到「权益中心」。深挖发现旧 Find-Username 按 cy 降序取「最靠下的词」，而 PS 5.1 下 `Sort-Object @{Expression='cy';Descending=$true}` 对哈希表数组的属性查找全失败（键全等→退化成不稳定排序，实测输出=输入序的任意置换）——锚点选择从来不是按 cy 排的，只是多数天的词表下偶然选中 warpeas；当天 2 元素词表下选中 agent-c..（工作区名，点它不开账户菜单）→ pending → 按设计保留窗口 → 主人重开客户端后启动弹窗路线补领成功（00:04，该轮不拥有客户端故不关窗，即主人问的「签完没自动关」的真相）。修法：锚点改「底栏行内最左多字词」（max cy ±12px 定底栏行，行内 cx 升序，warpeas cx≈161 对 agent-c.. cx≈653 稳赢），每轮重抓帧重解析、最多 2 个候选逐点击（候选间 Esc 清场）；排序必须用脚本块表达式 @{Expression={$_.cx}}。回归测试 scripts/test_username_anchor.py 从 ps1 的 ANCHOR-REGION 抠判据跑 5 个真实 OCR 词框样本（含 cy 抖动翻转、漏检用户名降级、最大化态左侧栏排除）。同款坑在 scripts/ui_claim_minimax.ps1 Find-AppWindow 也存在并已修（输入序 [好,坏] 时会选出 score=0 诱饵窗→UI 路线熄火）。21:48 实测（完整 checkin 轮）：锚点 (161,1089) 一轮命中→权益中心→黑药丸→领取成功，驱动正常入账 +100（连签8）并关闭本次冷启动的客户端。教训：PS 5.1 里对哈希表数组做排序/度量，字符串属性名一律不可靠（Sort-Object/Measure-Object -Property 均实测踩雷），必须脚本块表达式或显式循环。【2026-10-20 积分查询通道打通：读客户端自己落的用量日志】① 数据源 = `%APPDATA%\\com.qodercn.app.stable\\logs\\<session>\\main.log` 里的 `[Auth] [AccountUsage] 用量响应摘要 {json}`，它就是 `GET https://openapi.qoder.com.cn/sash/api/v2/me/usage` 的响应摘要——属 SAFETY 路线 2「让客户端自己说话」：不解密、不联网、不碰凭据。模块 agent_credit/qodercn_credits.py（`credit credits qodercn`）。② **能查到（服务端真值，桶级）**：userQuota(套餐内 Credits)/addOnQuota(资源包 Add-on) 的 total/used/remaining + expiresAt + totalUsagePercentage + isQuotaExceeded；另有签到态 `[Campaign] {showCampaign, claimable}`（每会话必有，claimable=false 即今日已领，比「不可领取」文案可靠）。③ **查不到（已定案，别再找）**：逐条积分的剩余与过期时间。me/usage 响应只有上述几个桶，没有任何批次数组；orgResourcePackage / dedicatedResourcePackageCount 在个人号恒为 「missing」；本账号实测 expiresAt=253402214400000（年 9999 哨兵=无到期，不当日期登记）。i18n 的「还有 N 个资源包」是组织/专属资源包场景，个人号用不上。→ 2026-10-20 定案：对账走**第三种登记语义 reconcile**（ledger.reconcile_total，载荷形如 {total: N, reconcile: fifo}）——服务端总数用来校正台账总量（多则按先到期先扣、少则补一条），逐日领取的每条到期日按「领取日+30 天」保留，看板把余额标成服务端真值、把过期标成「按领取日推导」（board 新增条目级 expiry_basis 字段区分这两个口径）。⚠️ 反面教材：当天先用 grants/快照登记过一次，把 8 条 ×100 压成 1 条无过期条目，临期队列与优先级当场失明；已恢复并重跑测试。④ **external 直连为何排除**：token 在 `%APPDATA%\\com.qodercn.app.stable\\auth.v1.dat`，头三字节 `v10` = Chromium safeStorage(DPAPI) 密文 → SAFETY 第 1 节「解密加密存储的登录态」绝对禁止（与 Trae 的 iCubeAuthInfo、AutoClaw 的 enc: 同类）。此前 notes 说「~/.qoder-cn/.auth 无明文凭据」结论对，但凭据真正位置在 Roaming 的 auth.v1.dat，别再翻 .auth。网页版 `https://qoder.com.cn/account/usage` 存在（未登录会弹回 /users/sign-in），要走这条路得用主人已登录的浏览器，属另一条待批路线。⑤ **刷新触发（关键限制）**：用量请求**只在打开「我的用量」面板/小窗时发出**（13 个历史会话仅 2 个有记录；10-16 08:45:37 那条正是 ps1 点开小窗的瞬间）。故 --ledger/--line 带**新鲜度闸门**：非当天记录一律拒绝登记（旧值会把签到后的真实余额覆盖成旧值，Trae 踩过）。现版领取路径走「用户名→权益中心」不点仪表，所以 2026-10-20 给 ui_claim_qodercn.ps1 加了 **-Usage 模式**：以用户名文字右缘为锚、在 +6..+280px 带内按**相对色差**（先取用户名左侧的底栏背景亮度做基准）扫紧凑图标簇，逐个点一次并只认「点击后新出现的文字」（我的用量/套餐内/资源包/查看详情）——用新词判开窗是防自指污染：主人常在 Qoder 里聊这些词，全屏匹配会假阳性。点歪只 Esc 复位，绝不连点（底栏曾有误点拉 Edge 的先例）。扫不到簇时用实测相对偏移 +204 兜底一次。成败仍由 Python 侧闸门裁定。已接进 scripts/_daily_chain.ps1（checkin → trae sync → **qoder -Usage → credit.py sync --only qodercn** → board）。-Usage -DryRun 只报候选坐标不点击，可安全预演。⑥ 交叉佐证：10-16 08:45:37 记录 addOnQuota remaining=300（当时连领 3 天），08:48 领取后台账记 400，与桶值 +100 吻合 → 该桶就是客户端「资源包」余额本体。⑦ 2026-10-20 端到端实测：23:31 主人手动开面板 → 资源包 remaining=800 / total=800 / used=0，与台账连签 8 天 ×100 分毫不差；同会话 [Campaign] showCampaign=true, claimable=false 认定今日已领 —— 旧疑问「+100 到底到账没有」就此闭环。⚠️ 但 used=0 意味着**用量消耗没有记进这两个桶**，这条更像「累计领取额」而不是「可烧余额」；要在真用掉一批后再取一次才能定口径（若恒为 0，优先级里就该按「只增不减的领取额」看待）。23:57 自动链实测：-Usage 点 screen(400,2023) 开窗，同一秒 main.log 落下新的「用量响应摘要」，credit sync --only qodercn 报 800 → 800（reconcile，8 条）。失效条件：日志不再落「用量响应摘要」、qoderUsage 字段改名、userData 目录名 com.qodercn.app.stable（product.json 的 dataDirectoryName）变更、或 openapi 响应结构漂移。【2026-10-22 方案甲：条带后台签到】Qoder 的 Chromium 在整窗屏外/最大化屏外时 PrintWindow 全空白，旧「CopyFromScreen 才能抓叠加层」结论需修正：还原态留 48px 边 + HWND_TOPMOST 置顶（SWP_NOACTIVATE，绝不激活；收尾 HWND_NOTOPMOST 并恢复 z-order）后，PrintWindow(PW_RENDERFULLCONTENT) 能完整抓到窗口与活动弹窗叠加层。账户菜单/权益中心的合成鼠标消息可用（零暴露），「领取」仍需 BringBack：移回原位 → SendInput → 光标/前台保存恢复 → 回条带。空闲闸门：Python 先等用户空闲 60s（最多 300s），ps1 -IdleWaitSec 兜底（-Usage 默认 120s）；收尾恢复原 rect/最大化，并按启动前前台窗口恢复 z-order。2026-10-22 实测：menu synth、BringBack 关闭 X、-Usage 面板均通过；-Offscreen:$false 可回退。【2026-10-30 最小化窗口补缺】客户端一直开着、窗口最小化在任务栏时，00:03 定时轮白等 90s 报 notfound（logs/ps1_qodercn.log 只有一句 RESULT，没有 window hwnd 行）。实测最小化窗口形态：MainWindowHandle 仍非 0、IsWindowVisible=true，但 GetWindowRect 是 -16000,-16000 157x25（200% DPI），还原尺寸要读 GetWindowPlacement 的 rcNormalPosition（实测 1800x1045、showCmd=2、flags=2 即恢复回最大化）。旧 Find-QoderWindow 按 rect(−10000 外) 与面积(≥600x400) 两刀都把它切掉，Restore-HiddenQoderWindow 又只认 WS_VISIBLE=off 的托盘隐藏窗 → 两头漏，被当成「客户端没开」。现 Find-QoderWindow 加 IsIconic 分支：GetWindowPlacement 判主窗口（排除 314x50 辅助窗）→ SW_RESTORE → 干活，收尾 Restore-OriginalRect 按 WasMinimized 再 SW_MINIMIZE 放回主人原状态；notfound 时 Log-WindowProbe 把同进程顶层窗口的 class/vis/iconic/rect/normal/title 全部落日志，下次不用再猜。2026-10-30 01:24 用最小化态跑 -DryRun 验证：认出 iconic → 还原 → 用户名/权益中心 → RESULT already → 恢复 rect → 再最小化。"
    models_note: "分级池 Auto/Ultimate/Performance/Efficient：Qwen3.8-Max、Kimi-K3/K2.7-Code、GLM-5.3/5.2、DeepSeek-V4-Pro/Flash、MiniMax-M3；可接百炼/智谱/Kimi/MiniMax 等自定义【2026-10-22 官方文档】"
