    open_when_needed: false
    notes: "【2026-10-25 双击签到】首击问题修好后仍有 2 次「坐标对、窗口前台、按钮没反应」：11:08/12:36 点击前卡片是「签到 + 已签到17天」，首击 @1160,1046 后 7.5s 仍是原样；12:40 同一坐标首击后 2s 补第二击，立刻变「已完成已签到18天」。判断是 CEF/React 首击只完成焦点切换、onClick 未触发（10-24 首击能成是因为窗口已被任务拉起且主人空闲，焦点没被抢）。最终改为「短间隔双击 + 多轮」：每轮连点 2 下（180ms），最多 3 轮（共 6 击），每轮 OCR 复核；成功判据增加「已签到N天」数值上涨（17→18）和「按钮连续两帧消失」；已领取后按钮禁用，重复点击幂等。12:40 实跑：首击无效 → 2s 后第二击 → 已签到18天 +200。失效条件：按钮点击区域改成弹窗确认、或连签文案不再含「已签到N天」。【2026-10-25 真实点击被前台窗口挡住】00:08 进入灵感中心后签到按钮的 BringBack 报「spot 520,132 被遮挡」「spot 0,0 被遮挡」，两个落点都被 R3 拦下，真实点击根本没发出去，结果却仍写「已点击签到位置」。根因与 Trae 10-24 相同：移回屏内用 0x0015（含 NOZORDER），窗口没被抬到最上层，主人当前前台窗口盖住了点击位。修法：BringBack 移回时用 HWND_TOPMOST + SWP_NOACTIVATE（0x0011，不抢焦点，曝光约 0.5s），点完/放弃路径都立刻 HWND_NOTOPMOST 再回屏外。2026-09-24 自述调研（当时 v1.19.0，端点自 resources/app.asar 反编译，已本机复核命中；2026-10-25 复核当前版本 1.20.0，asar 310,216,022 字节）：签到是任务体系，task_id='daily_signin'，端点 /autoclaw-proxy/proxy/autoclaw-task-{list,complete}，host=autoglm-acceleration-api.zhipuai.cn，鉴权 X-Auth-Appid/TimeStamp/Sign + Bearer。token 在 %USERPROFILE%\\AppData\\Roaming\\autoclaw\\auth.json 为 safeStorage 加密（enc: 前缀），external 直调需解密登录态 -> 按 research/SAFETY.md 否决。首页「每日签到」横幅受实验开关 show_checkin_banner 控制（defaultValue off，生产默认不展示），点击只打开「灵感中心」视图，签到动作在灵感中心任务卡片里（i18n：标题「每日签到」/ 副「赚 {{points}} 分/天」/ 已完成「已完成」）。横幅 onClick 是普通 React 事件，无 isTrusted 校验 -> OCR 点击路线可行，此前长期 pending 是入口定位与加载等待问题，不是被过滤。失效条件：v1.20.0 改版、端点改路径、或横幅开关改为默认 on。额度/连签/有效期由服务端下发，代码无硬编码（reliability: 已实测；09-24 起 UI 链路跑通，10-25 复核 31/32 天有记录）。2026-09-24 提权实测跑通：入口 = 侧边栏「灵感与活动」→ 赚积分任务首卡「每日签到」→ 卡片内黑色「签到」按钮；已签态 OCR 文案为「已完成 / 已签到N天」，幂等判定靠它；脚本在 ok/already 分支会 taskkill 客户端。日额度 200 主人已确认（卡片副标题「签到得@20 积分」是显示/OCR 误差）。积分并非永久：客户端曾提示「152 积分将于 3 天内到期」，与 points/expiring 端点吻合，但整体有效期天数仍由服务端下发，validity_days 保持 null。【2026-10-25 复核】当前 1.20.0；settings.json models.catalog = Auto/Auto-Fast（metadata.auto_model_name=deepseek-v4-pro）+ GLM-5.3 + GLM-5.3-Flash + 自定义 API；旧记录「桌面端只有 GLM」不成立。积分有效期分 daily/monthly/longTerm/campaign 四类，逐条到期日服务端不下发，台账按「过期未知」处理，不能写「无过期」。"
    models_note: "【2026-10-25 本机 1.20.0 settings.json 实测】Auto（zai_auto，metadata.auto_model_name=deepseek-v4-pro，1M context/393k output，低消耗）+ Auto-Fast（zai_auto-fast，1M/131k，支持图片，中消耗）+ GLM-5.3（zaicoding_glm-5.3，1M/307k，高消耗）+ GLM-5.3-Flash（zai_glm-5.3-flash，1M/131k，支持图片，低消耗）+ 自定义 API（本机 Ollama qwen3:14b）。不是『只有 GLM』，也不是旧记录的多厂商大池；官方 2026-10-22 页面另列 GLM-5-Turbo/GLM-5V-Turbo，未在本机目录出现。"
    rating:
