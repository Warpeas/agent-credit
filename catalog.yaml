# ⚠️ 探索本文件描述的任何客户端之前，先读 research/SAFETY.md。
# 账号承载真实付费订阅，被判定为自动化攻击会直接封号、囤的积分归零，
# 代价远高于多领 100 积分。禁止解密登录态 / 开调试口 / 篡改客户端 /
# 重试风暴 / 绕验证码；查不到就写unknown。

# 积分有效期口径（2026-10-04 逐家实测，来源分三档，见下）
#   confirmed  = 客户端 i18n 硬编码 或 服务端返回 expires 字段，或官方规则明示
#   measured   = 实测/服务端返回，但客户端不写死、由服务端按账号下发
#   unknown    = 客户端与 API 都没有该字段，规则完全由服务端控制，本地无从查证
