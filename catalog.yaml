      review: "200/天，有效期分类（daily/monthly/longTerm/campaign，非统一天数），本地执行能力全，有思考过程。模型不是只有 GLM：1.20.0 的 Auto/Auto-Fast metadata 指向 DeepSeek-V4-Pro，另有 GLM-5.3/5.3-Flash，且支持自定义 API；但内置目录只有 4 个，场景覆盖仍不如多厂商大池。签到藏在灵感中心任务卡里靠 OCR 定位，首页横幅还受服务端开关控制，随时可能定位不到；实测经常容易资源紧张，任务会停止执行；时不时有送大额积分的活动（非固定周期，不能当稳定日额度）。有效期逐条到期日服务端不下发，台账按『过期未知』处理。"
