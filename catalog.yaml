  - id: minimax
    name: MiniMax Code
    aliases: [mm, minimaxcode]
    vendor: MiniMax
    unit: credit
    grant_type: accumulating
    # 【2026-10-04 按服务端实测修正】原记 400 是错的。GET /signin/status 的
    # days[] 数组直接下发每日真实额度：points(基础) + bonus_points(加成)。
    # 7 天周期实测值：day1-3 = 800+400，day4 = 2000+1000，day5-6 = 800+400，
    # day7 = 2000+1000。即**平时 1200/天**（800 基础 + 400 连签加成），
    # 第 4/7 天 3000，整周期 12000。
    # 旧配置 daily_amount=400 + bonus_on=[4,7] + bonus_amount=1000
    # 等价于「平时 400、第4/7天1500」，与真实值差 3 倍。
    daily_amount: 1200
    validity_days: 30
    cap: null
    claim_policy: always
    # external 直签为主路线（无 GUI、无 UAC、不受客户端广告影响）；claim_mode=ui
    # 保留为 token 过期时的兜底（checkin.py 里 external 失败会回退 UI）。
    claim_mode: ui
    command: 'python "{REPO}\vendor\minimax-auto-signin\signin.py" auto'
    streak:
      cycle_days: 7
      # 每天都有 400 连签加成（不是只有第4/7天）；第 4/7 天在此基础上再额外 +1000
      daily_bonus: 400
      bonus_on: [4, 7]
      bonus_amount: 1000
      cycle_total: 12000
      mode: set_daily
    capabilities: [coding, multimodal]
    mobile: true
    mobile_note: "能看到桌面端的项目并继续对话（比 AutoClaw 移动端强）；模型同样只有 MiniMax 自家"
    open_when_needed: false
    notes: "签到卡在主页左下角。【2026-09-26 起改为 external 直签：全自动、不依赖客户端运行、不开窗口】端点 GET/POST /minimax-cloud/api/v1/signin/{status,claim}，host=https://agent.minimax.cn，鉴权 Authorization: Bearer（读本机明文凭据 %USERPROFILE%\\.minimax\\auth\\prod\\cn\\mcode-public\\auth.json；token 不进命令行、不进日志、不进输出）。**必须带 timezone_id=Asia/Shanghai**：缺失时 HTTP 仍 200 但业务返回 1406010011 invalid timezone_id；只有 IANA 名有效，8 / +8 / 28800 / Shanghai 全被拒。【2026-10-04 额度规则按服务端实测重写】GET /signin/status 返回的 days[] 直接下发真实额度，字段是 points(基础) + bonus_points(加成)，7 天实测：day1-3=800+400、day4=2000+1000、day5-6=800+400、day7=2000+1000→ **平时 1200/天、第4/7天 3000、整周期 12000**。旧记「400/天、第4/7天加1000」与真实值差 3 倍，已改。枚举 SigninDayStatus{Upcoming=1,Claimable=2,Claimed=3,Disabled=4}，已签判定用 status==3；**status==1(Upcoming) 表示当天额度还没到可领时间，此时 claim 会被拒**——10-04 凌晨 00:14 那轮就是 Upcoming，所以没领成，不是脚本坏了。已签判定以服务端为准不重复领取（2026-09-26 实测幂等）。**有效期 30天是官方口径**（asar 内 usage_resource_tooltip_rule1 原文：「赠予积分（如签到奖励，30天有效）仅限 MiniMax Code 使用」），但要注意**付费积分有效期 1 年**（同段 rule2），台账只跟签到赠予的 30 天。扣费顺序 Token Plan > 积分。【2026-09-27 修正·最终】弃用 UI 路线的旧理由「无法冷启动」已被实测推翻；真实约束是本自动化会话只能以 runas 拉起 GUI，非提权起不来。冷启动渲染延迟约 12s，过早 OCR 只能看到标题栏。【2026-09-30 · 国庆活动推广干扰 UI 路线】9.28-10.07 活动推广文案同时含「每日签到」「领取」，会劫持锚点/按钮识别并吞掉点击，已加固限定左侧栏 x<600 + 文本长度上限 12/16；该推广层当日 UI 路线实际不可用，故 external 为主路线。失效条件：token 过期（脚本打印剩余小时；沙箱内 Popen 拉不起 GUI，需用非提权计划任务 RunLevel=Limited+LogonType=Interactive 拉起）、端点改路径、timezone 校验变更、当天额度处于 Upcoming 状态。此前「isTrusted 过滤」只对 UIA InvokePattern 成立，不要再拿它当否决理由。"
    models_note: "MiniMax-M3 / M2.7 / H3"
    rating:
      value: 5
      capability: 4
      automation: 5
      review: "可累积额度里的天花板：**1200/天、第 4/7 天 3000、7 天周期 12000**（2026-10-04 按服务端 days[] 实测修正，旧记 400/天差 3 倍），赠予积分 30 天有效。external 直签无GUI 无 UAC，不受客户端活动推广干扰，是当前唯一完全无感的路线。唯一软肋是 accessToken 有效期极短（客户端停跑就废），需靠计划任务在签到前先拉客户端续期。模型限于 MiniMax 自家（M3/M2.7/H3），多模态是加分项。"
