    open_when_needed: false
    notes: "2026-09-24 自述调研（v1.19.0，端点自 resources/app.asar 反编译，已本机复核命中）：签到是任务体系，task_id='daily_signin'，端点 /autoclaw-proxy/proxy/autoclaw-task-{list,complete}，host=autoglm-acceleration-api.zhipuai.cn，鉴权 X-Auth-Appid/TimeStamp/Sign + Bearer。token 在 C:\\Users\\Hunter\\AppData\\Roaming\\autoclaw\\auth.json 为 safeStorage 加密（enc: 前缀），external 直调需解密登录态 -> 否决。首页「每日签到」横幅受实验开关 show_checkin_banner 控制（defaultValue off，生产默认不展示），点击只打开「灵感中心」视图，签到动作在灵感中心任务卡片里（i18n：标题「每日签到」/ 副「赚 {{points}} 分/天」/ 已完成「已完成」）。横幅 onClick 是普通 React 事件，无 isTrusted 校验 -> OCR 点击路线可行，此前长期 pending 是入口定位与加载等待问题，不是被过滤。失效条件：v1.19.0 改版、端点改路径、或横幅开关改为默认 on。额度/连签/有效期由服务端下发，代码无硬编码（reliability: 未实测）。2026-09-24 提权实测跑通：入口 = 侧边栏「灵感与活动」→ 赚积分任务首卡「每日签到」→ 卡片内黑色「签到」按钮；已签态 OCR 文案为「已完成 / 已签到N天」，幂等判定靠它；脚本在 ok/already 分支会 taskkill 客户端。日额度 200 主人已确认（卡片副标题「签到得@20 积分」是显示/OCR 误差）。积分并非永久：客户端曾提示「152 积分将于 3 天内到期」，与 points/expiring 端点吻合，但整体有效期天数仍由服务端下发，validity_days 保持 null。"
    models_note: "Pony-Alpha-2 / GLM / DeepSeek / Kimi / MiniMax"

  - id: lobsterai
    name: LobsterAI
    aliases: [lobster, 有道龙虾]
    vendor: 网易有道
    unit: credit
    grant_type: accumulating
    daily_amount: 100
    validity_days: 30
    cap: null
    claim_policy: always
    claim_mode: ui
    command: ""
    capabilities: [office, coding, local]
    open_when_needed: false
    notes: "【2026-09-27 UI 路线打通，claim_mode 改 ui】入口=主窗口右上角「每日积分礼」卡（2316x1442 窗口内 x≈2056,y≈109）。流程：runas 拉起 → 等窗口出现 → 轮询 OCR 直到无『启动中/％』（AI 引擎冷启动约 20s）→ 点卡片 → 多帧捕获（1.5/2/2.5s，期间禁止 SetForegroundWindow，会把弹层关掉）→ 点「立即领取/领取/签到」→ 验证「今日已领/已领/成功」。实测关键结论（2026-09-28 修正）：①【签到反馈信号】此 UI 没有「今日已领」文字——成功=用户面板里「立即领取」按钮消失+积分额度上涨（实测 00:25→00:27：1000→1100，正好 +100）；②【首选路径】点左下角「我的」(约 3%宽,95%高) 展开用户面板 → 点面板内「立即领取」（限 x<35% 窗宽，避免误匹配广告）→ 复查按钮消失；右上角卡片时有时无，只作兜底、不能当已领依据（此前「卡片点击后跨重启消失=已领取」的推断是错的，卡片会再出现）；③【广告弹窗】冷启动后可能弹「新用户专享¥0.01 解锁 1000积分」全屏遮罩（即 desktop_startup_modal placement），必须先关——先 ESC，无效则点窗口 (69%宽,27%高) 处的圆形×；④.ps1 必须 UTF-8 带 BOM，否则 PS5.1 按 GBK 读中文正则直接语法错误且零输出——正文含中文就要 BOM，首行 ASCII 注释救不了；⑤【三段式】launch_lobsterai.py（runas 一次 UAC，经 explorer 降权拉起 → app 以普通权限常驻、不随脚本退出而被终止）→ run_lobsterai_claim.py 默认非提权 + -NoLaunch 反复跑 explore/claim/verify → 最后才退出 app。原 external 路线保留备用：2026-09-26 逆向 + 实测：签到是 client-activities 活动体系。host=https://lobsterai-server.youdao.com；槽位 GET /api/client-activities/slot?placement=desktop_sidebar|desktop_startup_modal&clientVersion=1.0.0&containerApiVersion=1&platform=win32；签到 POST /api/client-activities/daily_check_in/actions/check_in；鉴权 Authorization: Bearer，token 在本机明文 %APPDATA%\\LobsterAI\\lobsterai.sqlite 的 kv 表 auth_tokens（脚本内读取，不入命令行与日志）。**当前服务端未下发任何签到活动**：实测 slot 返回 code 0 但 slotState=empty、activity=null（两个 placement 都一样），context 返回 51100 活动不存在——脚本因此报 [no-activity] 并退出码 2，属正常现象不是故障。活动一旦下发即可自动签到，无需改代码。失效条件：host 变更、活动体系改版、sqlite 里 auth_tokens 结构变化。另有一条 /api/credits-reset-campaign/free-credits/claim（需 campaignCode），对应日历里 9-29 到期的 300 赠送，campaignCode 来源尚未找到。"
    models_note: "GPT-4o / Claude / Gemini / DeepSeek 等 10+"

