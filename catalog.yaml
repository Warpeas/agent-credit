  - id: workbuddy
    name: WorkBuddy
    aliases: [wb, 腾讯workbuddy]
    vendor: 腾讯
    unit: credit
    grant_type: accumulating
    daily_amount: 100
    validity_days: 30
    cap: null
    claim_policy: always
    claim_mode: external
    command: set WORKBUDDY_AUTH_FILE=%LOCALAPPDATA%\CodeBuddyExtension\Data\Public\auth\workbuddy-desktop.info&& set WORKBUDDY_BUDGET_SECONDS=50&& python "{REPO}\vendor\workbuddy-auto-signin\signin.py" auto
    status_command: set PYTHONPATH={REPO}&& python -m agent_credit.wb_credits --line
    credits_command: set PYTHONPATH={REPO}&& python -m agent_credit.wb_credits --ledger
    streak:
      cycle_days: 7
      bonus_on: [7]
      bonus_amount: 1000
      mode: extra
    capabilities: [coding, office, docs]
    open_when_needed: false
    notes: "【2026-10-25 登录态失效】00:02 外部直签与 credits 查询同时返回 HTTP 401（AUTH_REJECTED），凭据文件本身可解密（doctor=AUTH_READY），但服务端拒绝。为验证是否只是 token 过期，用 explorer 拉起客户端一次：客户端随即把 workbuddy-desktop.info 删掉并写下 workbuddy-desktop.info.logged-out，即**登录会话已被服务端注销**，不是脚本/端点问题，只能人工重新登录。结论：WorkBuddy 的 access token 寿命约 3 天（上次登录 10-22 21:09，10-25 失效），客户端不常驻时没有刷新机会；以后遇到 401 先开客户端确认登录态，再手动补签。checkin 已把 AUTH_REJECTED 明确标注为「需重新登录」，不再混在普通 external 失败里。API 直签（vendor/workbuddy-auto-signin，MIT），稳定可靠。早期记录称「客户端模拟点击被 isTrusted 过滤」，该结论只适用于 UIA InvokePattern 路线，未经 OS 级注入复测；既然 external 可用，不做 UI 路线。auto 附带成长中心（派 Buddy/盲盒/任务）。【2026-10-19 增加积分明细查询，只读】credit credits workbuddy [--all|--json|--line]，或 python -m agent_credit.wb_credits。端点 /billing/meter/get-user-resource-{summary,free-packages,paid-packages}，⚠️ 资源类端点不带 /v2（签到端点才带，带错 404 Route Not Found）；free/paid 的 PackageCodes 不能为空数组（400 PackageCodes required），按客户端分组下发。每条 grant 带 CapacityRemainPrecise + DeductionEndTime(epoch ms)，过期优先级 DeductionEndTime→ExpiredTime→CycleEndTime（与客户端 toExpiredCreditPackage 一致）；余量优先级对齐客户端 resolveResourceCapacity：CapacityType=4 套餐配额的真余量在 CycleCapacityRemainPrecise（包级 CapacityRemainPrecise 是未扣减的包总量，曾据此把 500 当成余量，实测对账破等式后已修）。失效条件：端点改名 / sym-v1 信封升级（vendor 签到脚本会先炸）。【2026-10-19 签到后自动对账】checkin 末尾自动跑 credits_command（逐条明细，source=sync 重建账本条目、保留每条过期时间；`credit due` 的临期视图直接受益）；status_command 是总量快照兜底契约。开关 AGENT_CREDIT_SKIP_SYNC=1。详情 research/answers/workbuddy_credit_detail.md"
    models_note: "混元 Hy3/Hy4 + MiniMax-M3、GLM-5.2/5.1/5V-Turbo、Kimi-K3/K2.7-Code、DeepSeek-V4-Pro/Flash【2026-10-22 官方文档：已全面换代到 V4/K3/GLM-5 这一代】"
    rating:
      value: 4
      capability: 5
      automation: 5
      review: "额度不算最高但最省心：external 直签零交互，30 天有效期够攒，7 天连签再加 1000。2026-10 官方文档确认已换代到混元 Hy4 + Kimi-K3/GLM-5.2/DeepSeek-V4/MiniMax-M3 这一代，多模型池是台账里最全的一档，办公文档链路完整。"
      best_for: "日常编码主力 + 腾讯文档/办公场景"
      owner_note: "不能调用内置浏览器去调试网页——没有 Playwright，浏览器操控能力缺失。"


  - id: minimax
    name: MiniMax Code
    aliases: [mm, minimaxcode]
    vendor: MiniMax
    unit: credit
    grant_type: accumulating
    # 【2026-10-24 第三次修正·补正 bonus_points 语义】前两版（10-04 的
    # 「1200/天、第4/7天3000、整周期12000」与 10-11 的「平时400/天、day1=1200、
    # 整周期4800」）都把服务端的 bonus_points 当成**额外再加一份**，其实是重复计账。
    # 权威依据在客户端自带的类型定义里（app.asar @mavis/shared/src/daily-signin.ts）：
    #   /** Extra credits already included in points; absent on older responses. */
    #   bonus_points?: number;
    # 即 points 已包含 bonus；前端渲染同源（total_points = points，
    # 签到按钮上的「签到得@N」用的也是 points）。
    # 官方口径（agent.minimax.cn/docs/code/account/usage，2026-10-24 核对）：
    #   每日 400；连续签到第 4、7 天单日加码至 1000；一周累计 4000；
    #   签到积分可累计使用，自到账起 30 天有效。
    # 2026-10-24 实测 GET /signin/status（is_today=day4，全周期可读）：
    #   day1=400 day2=400 day3=400 day4=2024(1000基线+1024活动加成)
    #   day5=400 day6=400 day7=1000 → 整周期 5024
    # 活动期服务端会把当天额度翻倍，并把多出来的部分记在 bonus_points 里
    # （国庆期 10-04..10-07：day1=800/bonus400、day4=2000/bonus1000）。
    # ⚠️ 活动额度服务端可变，不是稳定承诺。改额度前先重新读 status，
    # 别拿本文件的数字当既成事实（external 脚本上报实发额，账本以实发为准，
    # 本文件只影响 `credit status` 的预估与 external 失败时的兜底）。
    # daily_amount_by_day 存的是**官方基线整档额度**（不做「基础 + 加成」拆分，
    # 活动期由服务端实发覆盖）。daily_amount 保留 400 作为「典型日」兜底
    # （yaml_lite 不支持嵌套 dict 时用）。
    daily_amount: 400
    validity_days: 30
    cap: null
    claim_policy: always
    # external 直签为主路线（无 GUI、无 UAC、不受客户端广告影响）；claim_mode=ui
    # 保留为 token 过期时的兜底（checkin.py 里 external 失败会回退 UI）。
    claim_mode: ui
    command: 'python "{REPO}\vendor\minimax-auto-signin\signin.py" auto'
    # 2026-10-25：warmup 自己最多等 180s 让客户端续期，checkin 原先写死 60s，
    # 正好把续期中的脚本杀掉（10-25 00:02 漏签）。按账户放宽到 240s。
    command_timeout: 240
    # 【2026-10-24 服务端真值通道】GET /minimax-cloud/api/v1/credit/details 逐笔返回
    # 剩余与到期时间（credit_type 1=购买 2=签到赠予，include_expired=true 含历史），
    # 对齐项目 credits_command 契约。接上之后 MiniMax 从「本地估算」升为「服务端真值」，
    # 台账不再需要手算 bonus_points 口径；实测与服务端逐笔一致（10-24 那笔 = 2024）。
    credits_command: 'python "{REPO}\vendor\minimax-auto-signin\credits.py"'
    streak:
      cycle_days: 7
      # 官方基线：平时 400，第 4/7 天 1000（= 400 + 600 加成），整周期 4000。
      # 活动期服务端会翻倍（10-24 实测 day4=2024），实际入账以服务端实发为准。
      daily_bonus: 0
      bonus_on: [4, 7]
      bonus_amount: 600
      bonus_amount_by_day: {4: 600, 7: 600}
      daily_amount_by_day: {1: 400, 2: 400, 3: 400, 4: 1000, 5: 400, 6: 400, 7: 1000}
      cycle_total: 4000
      mode: set_daily
    capabilities: [coding, multimodal, office]
    mobile: true
    mobile_note: "能看到桌面端的项目并继续对话（比 AutoClaw 移动端强）；模型同样只有 MiniMax 自家"
    open_when_needed: false
    notes: "【2026-10-25 续期超时被误杀】00:02 外部直签发现 token 只剩 61s，自动按设计临时拉起客户端续期；warm_token 内部允许等 180s，但 checkin 的外部命令超时写死 60s，62s 把正在续期的脚本（很可能连着客户端）一起杀掉，随后 UI 兜底也因「90s 内未出现主窗口」pending。对照：00:10 同一轮 sync 阶段的 credits.py 用同样方式 5s 就续期成功（gen 94→95），说明续期本身没问题，纯粹是超时给得太短。已给 catalog 加 command_timeout: 240，checkin 支持按账户覆盖（默认仍 60s）。签到卡在主页左下角。【2026-10-24 修正·bonus_points 语义】服务端 days[] 的 points **已包含** bonus_points（客户端自带类型定义原文：/** Extra credits already included in points; absent on older responses. */，前端渲染同源 total_points = points）。此前 signin.py 按 points + bonus_points 入账，凡是 bonus>0 的日子都多记：09-30/10-01/10-04/10-05/10-07 各多记 400，10-03/10-06 各多记 1000，10-24 多记 1024，**合计多记 5024**，台账余额 27648 → **22624**（已修正，备份 data/_ledger_backup_20261024_before_mmbonus_fix.json）；signin.py 已改为只取 points。**官方额度口径**：每日 400，连续签到第 4/7 天单日加码至 1000，一周累计 4000，到账起 30 天有效且可累积（agent.minimax.cn/docs/code/account/usage）。【2026-09-26 起改为 external 直签：全自动、不依赖客户端运行、不开窗口】端点 GET/POST /minimax-cloud/api/v1/signin/{status,claim}，host=https://agent.minimax.cn，鉴权 Authorization: Bearer（读本机明文凭据 %USERPROFILE%\\.minimax\\auth\\prod\\cn\\mcode-public\\auth.json；token 不进命令行、不进日志、不进输出）。**必须带 timezone_id=Asia/Shanghai**：缺失时 HTTP 仍 200 但业务返回 1406010011 invalid timezone_id；只有 IANA 名有效，8 / +8 / 28800 / Shanghai 全被拒。【2026-10-04 额度规则按服务端实测重写（该条已作废，见文首 2026-10-24 修正）】GET /signin/status 返回的 days[] 直接下发真实额度，字段是 points(基础) + bonus_points(加成)，7 天实测：day1-3=800+400、day4=2000+1000、day5-6=800+400、day7=2000+1000→ 当时记成 **平时 1200/天、第4/7天 3000、整周期 12000**。作废原因：bonus_points 含在 points 内，实发是 800/2000；周期基线 4000。旧记「400/天、第4/7天加1000」与真实值差 3 倍，已改。枚举 SigninDayStatus{Upcoming=1,Claimable=2,Claimed=3,Disabled=4}，已签判定用 status==3；**status==1(Upcoming) 表示当天额度还没到可领时间，此时 claim 会被拒**——10-04 凌晨 00:14 那轮就是 Upcoming，所以没领成，不是脚本坏了。已签判定以服务端为准不重复领取（2026-09-26 实测幂等）。**有效期 30天是官方口径**（asar 内 usage_resource_tooltip_rule1 原文：「赠予积分（如签到奖励，30天有效）仅限 MiniMax Code 使用」），但要注意**付费积分有效期 1 年**（同段 rule2），台账只跟签到赠予的 30 天。扣费顺序 Token Plan > 积分。【2026-09-27 修正·最终】弃用 UI 路线的旧理由「无法冷启动」已被实测推翻；真实约束是本自动化会话只能以 runas 拉起 GUI，非提权起不来。冷启动渲染延迟约 12s，过早 OCR 只能看到标题栏。【2026-09-30 · 国庆活动推广干扰 UI 路线】9.28-10.07 活动推广文案同时含「每日签到」「领取」，会劫持锚点/按钮识别并吞掉点击，已加固限定左侧栏 x<600 + 文本长度上限 12/16；该推广层当日 UI 路线实际不可用，故 external 为主路线。失效条件：token 过期（脚本打印剩余小时；沙箱内 Popen 拉不起 GUI，需用非提权计划任务 RunLevel=Limited+LogonType=Interactive 拉起）、端点改路径、timezone 校验变更、当天额度处于 Upcoming 状态。此前「isTrusted 过滤」只对 UIA InvokePattern 成立，不要再拿它当否决理由。"
