    capabilities: [office, coding, local, multimodal]
    open_when_needed: false
    notes: "【2026-10-25 修正：签到活动可用，旧探测参数过期】用当前客户端版本重测：slot?placement=desktop_sidebar&clientVersion=2026.10.16&containerApiVersion=2 → 200 slotState=available，activityCode=daily-check-in-evergreen-prod-20260814；context?configRevision=1 → state.rewardCredits=100、claimedDays=34、claimedCredits=3400、claimedToday=true。旧脚本写死 clientVersion=1.0.0 + containerApiVersion=1，才一直返回 empty；不是服务端没活动。external 直签已具备条件（status 只读实测通过），但主路线仍保持 UI，未擅自切换。【2026-10-25 chip 合成消息假成功】10-24/10-25 连续两天在右上角「每日积分礼」card 上执行 Click-At，合成消息只要投递成功就记 msg-ok 并 return，但 chip1..3 三帧 OCR 完全没变化（没有「立即领取」/「今日已领」），说明这次点击根本没进 React。10-23 同一条路曾经成功，属偶发/版本差异，不能继续依赖合成消息。修法：chip、左下「我的」用户栏、Path B 兜底卡统一改为真实点击（屏外直接 BringBack-Click，非屏外 -SkipSynth）；BringBack 同时补上 HWND_TOPMOST（0x0011）与事后 NOTOPMOST，避免 10-25 另一个坑「前台窗口盖住点击位 → 两个落点都被 R3 拒绝」。【2026-09-27 UI 路线打通，claim_mode 改 ui】入口=主窗口右上角「每日积分礼」卡（2316x1442 窗口内 x≈2056,y≈109）。流程：runas 拉起 → 等窗口出现 → 轮询 OCR 直到无『启动中/％』（AI 引擎冷启动约 20s）→ 点卡片 → 多帧捕获（1.5/2/2.5s，期间禁止 SetForegroundWindow，会把弹层关掉）→ 点「立即领取/领取/签到」→ 验证「今日已领/已领/成功」。实测关键结论（2026-09-28 修正）：①【签到反馈信号】2026.10.16 版 UI 已能直接看到「今日已领」与「奖励到账 +100积分」（2026-10-25 11:09 实测）；旧版（2026-09-28）确实没有「今日已领」文字，当时只能靠「立即领取」按钮消失+积分额度上涨判定（00:25→00:27：1000→1100，+100）。两种信号都保留，优先文案、兜底额度差；②【首选路径】点左下角「我的」(约 3%宽,95%高) 展开用户面板 → 点面板内「立即领取」（限 x<35% 窗宽，避免误匹配广告）→ 复查按钮消失；右上角卡片时有时无，只作兜底、不能当已领依据（此前「卡片点击后跨重启消失=已领取」的推断是错的，卡片会再出现）；③【广告弹窗】冷启动后可能弹「新用户专享¥0.01 解锁 1000积分」全屏遮罩（即 desktop_startup_modal placement），必须先关——先 ESC，无效则点窗口 (69%宽,27%高) 处的圆形×；④.ps1 必须 UTF-8 带 BOM，否则 PS5.1 按 GBK 读中文正则直接语法错误且零输出——正文含中文就要 BOM，首行 ASCII 注释救不了；⑤【三段式】launch_lobsterai.py（runas 一次 UAC，经 explorer 降权拉起 → app 以普通权限常驻、不随脚本退出而被终止）→ run_lobsterai_claim.py 默认非提权 + -NoLaunch 反复跑 explore/claim/verify → 最后才退出 app。原 external 路线保留备用：2026-09-26 逆向 + 实测：签到是 client-activities 活动体系。host=https://lobsterai-server.youdao.com；槽位 GET /api/client-activities/slot?placement=desktop_sidebar|desktop_startup_modal&clientVersion=<app version>&containerApiVersion=2|3&platform=win32；签到 POST /api/client-activities/{activityCode}/actions/check_in（activityCode 由 slot 下发，当前为 daily-check-in-evergreen-prod-20260814）；鉴权 Authorization: Bearer，token 在本机明文 %APPDATA%\\LobsterAI\\lobsterai.sqlite 的 kv 表 auth_tokens（脚本内读取，不入命令行与日志）。【2026-10-25 修正】旧结论「服务端未下发活动」是探测参数过期导致的误判：写死 clientVersion=1.0.0 + containerApiVersion=1 时两个 placement 都返回 empty；改用客户端实际版本 2026.10.16 与 placement 对应的 containerApiVersion（sidebar=2 / startup=3）后，slot 返回 available，activityCode=daily-check-in-evergreen-prod-20260814，context 返回 rewardCredits=100、claimedDays=34、claimedCredits=3400、claimedToday=true。external 脚本已按此修复（动态读 app.asar/package.json 版本 + activityType 判定 + idempotencyKey），但仍保留 UI 为主路线。失效条件：host 变更、活动体系改版、sqlite 里 auth_tokens 结构变化。另有一条 /api/credits-reset-campaign/free-credits/claim（需 campaignCode），对应日历里 9-29 到期的 300 赠送，campaignCode 来源尚未找到。"
    models_note: "BYOK 多提供商（2026.10.16 客户端 provider 表）：内置免费 DeepSeek-V4.1-Flash（lobsterai-server/yd-fast，本会话 model=lobsterai-server/deepseek-flash）；BYOK 可接 OpenAI GPT-5.6 Sol/Terra/Luna、GPT-5.5/5.4，Anthropic Claude Opus 4.7/4.6、Sonnet 4.6，Gemini 3.1 Pro/3 Flash，xAI Grok 4.5/4.3，DeepSeek V4 Flash/Pro，Kimi K3/K2.6/K2.5，GLM 5.1/5/4.7，MiniMax M3/M2.7/M2.5，Qwen3.6/3.5 Plus，Doubao-Seed-2.0，另含 Ollama/LM Studio/GitHub Copilot/OpenRouter/自定义【2026-10-25 本机 app_config + dist-electron/shared/providers/constants.js；官网 2026.10.16】"
