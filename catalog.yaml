    open_when_needed: false
    notes: "Qoder CN 桌面端（Electron，进程名 'Qoder CN'，exe 在 %LOCALAPPDATA%\\Programs\\Qoder CN\\Qoder CN.exe，数据目录 ~/.qoder-cn）。【2026-10-13 主人确认 + 本机实测】有每日签到活动：弹窗「专属活动权益 / 立即查收」里的「每天领 100 Credits」，**每日 10:00 (UTC+8) 刷新，领取后 30 天有效，+100**。两种触发路径：①客户端启动时自动弹窗；②左下角用户名右侧的「用量」仪表图标 → 弹出「我的用量」小窗 → 点小窗里的礼盒图标 → 出现该活动弹窗 → 点「领取」。【机制来源，resources/app.asar 只读反编译】活动内容是服务端下发进 webview 的，bundle 里搜不到「专属活动权益/每天领」等文案（命中 0），且「签到」二字在 bundle 里也命中 0——早期据此误判为「无签到」，已由主人纠正。客户端有 ICampaignService，轮询 GET /sash/api/v1/me/campaigns/{id}/limited-number 取 {showCampaign, claimable}，CAMPAIGN_REFRESH_INTERVAL_MS≈1h，claimable 时左下角礼盒图标带 halo（campaign-claimable-indicator-halo）；领取动作在 webview 内点「领取」触发。【为什么 UI 而非 external】~/.qoder-cn/.auth 下无明文凭据（只有 machine_id 与 dynamic-texts 缓存），登录态不在明文里；按 research/SAFETY.md 不解密登录态 → external 拿不到凭据，故走客户端自身界面的 OCR + OS 级点击（与 AutoClaw/TraeWork/LobsterAI 同路）。【UIA 不可达】主窗口 UIA 树仅 13 个元素、无任何领取相关 Name（实测），活动层是 webview，UIA 看不见 → 必须 OCR。【实跑打通，2026-10-13 经每日计划任务(InteractiveToken+Highest)多轮验证，已实测领到】scripts/ui_claim_qodercn.ps1 全程**锚点定位、不写死坐标**（本机 200% 缩放且窗口在最大化/还原间变）：抓图用 CopyFromScreen(窗口矩形)；每条路径都现找目标。关键结论与踩坑：① **点击必须用 SendInput**，`mouse_event` 对 Qoder 的 webview 点不动（窗口纹丝不动）；且点击只在**真实交互桌面**（计划任务/用户终端）生效，agent 子进程里点不动。② 两条领取路径都跑通：**启动弹窗**（情况一，直接找领取）；**已打开时**点底栏「用量仪表」→「我的用量」小窗→「礼盒」→ 应用内活动弹窗（不是 Edge，之前误判是点到了「查看详情」）。③ 底栏图标/礼盒/领取全是无文字或黑底白字，OCR 读不出：用量仪表以**用户名文字为锚向右找图标像素簇**；礼盒以**「查看详情」文字左缘为锚、往左跨最大空白找窄图标簇**（按钮填充是宽簇、礼盒是窄簇）；**领取按钮用「中央区高密度中性黑块」定位**（黑底白字，OCR 读不出；要求中性黑以排除深绿「查看详情」）。④ 领取成功后按钮变灰「不可领取」——幂等判定认「不可领取/已领取」文案，不依赖黑药丸（否则领取后会误点到底部「查看详情」拉 Edge）。⑤ 致命 PowerShell 坑：`Log()` 用 `Write-Output` 会污染函数返回值（Find-BlackPill 里 Log 后返回，导致返回值变成日志字符串、被当成命中的按钮，算出 sx=-13 乱点）；Log 必须写 stderr/文件，不能用 Write-Output。⑥ 聊天面板满是「领取/礼盒/签到」关键词（脚本跑在 IDE 内）→ 领取只认黑药丸、不信 OCR 词。实测：10:08 点领取后按钮 领取→不可领取，已 `credit record qodercn claimed 100` 落账（连签1、剩余100）。失效条件：活动服务端下线/改额度/改刷新时间、弹窗文案或布局改版、账户条/用量小窗布局变化。⚠️ 待主人核对：Qoder 里 +100 Credits 是否确实到账（「不可领取」副文案是「活动已结束或不符合领取条件」的兜底语，需确认是「已领」而非「未领成」）。【2026-10-14 实测纠正】弹窗上的倒计时与「每日 10:00 (UTC+8) 刷新」**不是领取窗口限制**：当天 00:53 主人手动点「领取」立即成功（按钮 领取→领取中→已领取），凌晨即可领，10:00 前不存在服务端拒发。10-14 凌晨自动漏签的真实根因是编排层冷启动后只等 3s 就跑 ps1（主窗口 ~4s 后才出现 → notfound），已修为 Python 侧 + ps1 侧各 90s 轮询等窗口、成功后关闭本次冷启动实例；继续由**唯一的统一计划任务 agent-credit-checkin（00:05 全量 checkin）**领取，不为 Qoder 单独建任务。另再次确认：agent 子进程里的 SendInput 点击对该 webview 不生效（坐标/前台均正确但弹窗纹丝不动），真实交互桌面（计划任务/人点）才生效。【2026-10-16 主人报告 UI 改版】①启动时自动弹窗仍在；②新路径：点左下角用户名 → 展开菜单有「权益中心」→ 点击后仍弹出同一活动浮窗；③旧路径失效：左下角「用量」icon 下的礼品 icon 已移除（「我的用量」小窗不再有礼盒入口）。→ ui_claim_qodercn.ps1 的 path② 锚点（用户名右侧仪表 → 小窗礼盒）已废，需改为「用户名 → 权益中心」；当日 00:08 自动跑 pending（窗口最小化 rect=-32000 且底栏锚点未命中），待主人手签后 record。【2026-10-16 当日修复完成】ui_claim_qodercn.ps1 已重写：path② 改为「Esc 关浮层 → 点用户名文字中心 → 左侧菜单『权益中心』（OCR 跨字短语；限定左 1/3 区且在用户名上方，防聊天面板同名词误命中，最多两次重试）→ 同一活动浮窗 → 黑药丸领取」；删除旧礼盒/绿块路径（旧 Find-Gift 在新小窗里把暗簇误判成礼盒乱点）；幂等判定加弹窗标记门控（必须先命中『专属活动权益/立即查收/每天领』才认『已领取/不可领取』，因主人常在 Qoder 里聊签到脚本，聊天区常年有这些词）；Find-QoderWindow 过滤最小化位置(-32000)与 <600x400 的辅助窗口（00:08 pending 的另一根因：选中了 314x50 辅助窗）。交互桌面计划任务实测两轮全通过：08:48 情况一（启动弹窗）领取成功，按钮变灰『已领取』、文案『领取成功，Credits 已到账』；08:56 关掉弹窗后情况二（用户名→权益中心）走查成功，再次运行正确返回 already 不重复领。已 record qodercn claimed 100（连签4、余400，与客户端资源包余额一致）。【2026-10-20 修：情况二锚点静默失效一整天，根因是 PS 5.1 的 Sort-Object 字符串属性名对哈希表数组不生效】10-20 00:02 定时轮情况二 pending：点用户名后找不到「权益中心」。深挖发现旧 Find-Username 按 cy 降序取「最靠下的词」，而 PS 5.1 下 `Sort-Object @{Expression='cy';Descending=$true}` 对哈希表数组的属性查找全失败（键全等→退化成不稳定排序，实测输出=输入序的任意置换）——锚点选择从来不是按 cy 排的，只是多数天的词表下偶然选中 warpeas；当天 2 元素词表下选中 agent-c..（工作区名，点它不开账户菜单）→ pending → 按设计保留窗口 → 主人重开客户端后启动弹窗路线补领成功（00:04，该轮不拥有客户端故不关窗，即主人问的「签完没自动关」的真相）。修法：锚点改「底栏行内最左多字词」（max cy ±12px 定底栏行，行内 cx 升序，warpeas cx≈161 对 agent-c.. cx≈653 稳赢），每轮重抓帧重解析、最多 2 个候选逐点击（候选间 Esc 清场）；排序必须用脚本块表达式 @{Expression={$_.cx}}。回归测试 scripts/test_username_anchor.py 从 ps1 的 ANCHOR-REGION 抠判据跑 5 个真实 OCR 词框样本（含 cy 抖动翻转、漏检用户名降级、最大化态左侧栏排除）。同款坑在 scripts/ui_claim_minimax.ps1 Find-AppWindow 也存在并已修（输入序 [好,坏] 时会选出 score=0 诱饵窗→UI 路线熄火）。21:48 实测（完整 checkin 轮）：锚点 (161,1089) 一轮命中→权益中心→黑药丸→领取成功，驱动正常入账 +100（连签8）并关闭本次冷启动的客户端。教训：PS 5.1 里对哈希表数组做排序/度量，字符串属性名一律不可靠（Sort-Object/Measure-Object -Property 均实测踩雷），必须脚本块表达式或显式循环。"
    models_note: "多模型（界面见 Qwen3.8-Flash 等）"
    rating:
      value: 3
      capability: 4
      automation: 2
      review: "100/天、领取后 30 天有效、每日 10:00 (UTC+8) 刷新，可累积。Qoder 本身是能打的 agentic IDE（多模型、仓库级理解）。签到藏在服务端下发的活动 webview 里，UIA 看不见只能靠 OCR 点击；脚本全程锚点定位不写死坐标（应对本机 200% 缩放与窗口态变化）。但点击需在真实交互桌面里才落地（agent 子进程受 Windows foreground-lock 限制点不进去），要挂到每日计划任务或用户终端跑；启动自动弹窗那条判据最稳。"
