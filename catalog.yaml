      capability: 4
      automation: 5
      review: "可累积额度里的天花板：**平时 400/天，第 4/7 天单日加码到 1000，7 天周期 4000**（2026-10-24 按官方口径 https://agent.minimax.cn/docs/code/account/usage 核对，赠予积分 30 天有效、可累积；活动期服务端会翻倍，10-24 实测 day4=2024）。external 直签无GUI 无 UAC，不受客户端活动推广干扰，是当前唯一完全无感的路线。唯一软肋是 accessToken 有效期极短（客户端停跑就废），需靠计划任务在签到前先拉客户端续期。模型限于 MiniMax 自家但已换代到 M3.1-Flash/M2.7 + H3/H3 Max 视频，多模态是加分项。"
      best_for: "高频重度使用、多模态任务；移动端可续桌面端的对话"
      owner_note: "有移动端，能看到桌面端的项目并继续对话（这点比 AutoClaw 强，后者移动端是另一套环境、项目不同步）。模型两端都只有 MiniMax 自家（M3/M2.7/H3）。**手机端一次只能配对一台电脑**，换设备需要重新配对。"


  # 2026-10-09 字节官宣 TraeWork 与 TraeCode 合并为「TRAE」，两品牌不再并行
  # （对外统一叫 Trae）。2026-10-13 主人拍板彻底改名：account id `traework` →
  # `trae`，ledger 的 key 同步迁移（备份 data/_ledger_backup_20261013_before_trae_rename.json，
  # 18 条 entries 原样保留）；历史备份文件与历史记忆日志里的旧名不改，保持证据可追溯。
  - id: trae
    name: Trae
    aliases: [trae, 字节trae]
    vendor: 字节跳动
    unit: credit
    grant_type: accumulating
    # 2026-10-11 由 150 修正为 100：客户端菜单文案已变「每日领100积分」，
    # 且 7 组「点击前/点击后」同分钟余额差实测全部为 +100（见 notes）。
    daily_amount: 100
    validity_days: 31
    cap: null
    claim_policy: always
    claim_mode: ui
    command: ""
    # 2026-10-20 接入通用对账契约：Trae 的余额与到期日来自客户端扩展导出的
    # logs/trae_credit_detail.json（扩展只 executeCommand 客户端自己注册的
    # getter，不碰凭据、不解密——research/SAFETY.md 允许路线）。
    # 登记时带真实到期日，不再是一条无过期时间的快照——否则「快过期先烧」
    # 这条规则对 Trae 是瞎的（台账里曾只有 25 条本地估算 + 4 条无到期日快照）。
    # 载荷里的 granularity 标口径：per_pack=逐包明细；aggregate=客户端展示的
    # 聚合到期日（免费单桶账号下即每笔的到期日）。
    credits_command: set PYTHONPATH={REPO}&& python -m agent_credit.trae_credits --json
    extra_monthly: 500
    capabilities: [coding]
    open_when_needed: false
    notes: "【2026-10-25 入口被聊天标题劫持（4 次点击全落空）】菜单明明已展开、也读到了「每日领100积分」，但 Find-EntryWord 先匹配到了左侧聊天侧栏的任务标题「检查今日签到情况」（x=663<30%W，菜单展开时「签到」needle 被采信），点击坐标变成 @850,167 等聊天区位置；随后药丸扫描又因 menuRight 被聊天区含「消息/每日领」的长行拉到窗口右侧，扫到的是对话内容。复核余额 877125 也不是 Trae 余额（真实余额在菜单里 3,450），而是从对话正文「877,125」抓的。修法：① 入口只认「每日领」行或**独立短词** 签到/Check in，长句一律不认；② menuRight 与 Find-Balance 都限制在左 35% 窗宽内；③ Find-EntryWord 先把候选限定在左 30% 再调 Find-WordHit（后者每个 needle 只返回第一条命中，聊天区顶部行会挡住菜单行）。【2026-10-25 账户条永远点不开】$userHit 算出的锚点从未进入候选列表——$accWords 依赖 StartsWith(用户)，而新版 OCR 的 words 是单字数组 {0,用,户,71294228173,免,费}，永远匹配不到，只剩兜底点 (2.8%W,97.2%H)=108,2031（头像右侧空白缝），连点 3 天都开不了菜单。已把锚点作为首选候选；账户条点击改 -SkipSynth 真实点击，BringBack 点击前 Ensure-Foreground（未激活窗口的第一次点击会被 Chromium/React 吞掉），点完 Restore-Foreground。01:03 实测：锚点 @77,2022 开菜单 → 入口「每日领100积分」→ 药丸 @497,1221 → 余额 3450→3550 [granted] 100。10-24 的「已签到」误判在 18:46 已修（有入口就必须点、无证据一律 pending），本次 00:07 也正确报了 pending 而不是假 already。【2026-10-11 客户端合并 & 额度修正】TraeWork(TRAE SOLO CN) 已并入 TraeCode(Trae CN)：旧安装目录 %LOCALAPPDATA%\\Programs\\TRAE SOLO CN 现在只剩 debug.log，客户端只剩 Trae CN.exe（v3.4.2），主窗口标题变成 **Agent**（class 仍是 Chrome_WidgetWin_1；同 pid 另有 128x200 的小窗 title='Trae CN'，按「可见+有标题+面积最大」筛才选得对）。合并由 trae-cn://migration 触发，迁移发生在 2026-10-11 11:04~11:10。两个产品向来共用同一积分账户，台账继续只用 traework 一条，**不要新增账户**。本次同步改了默认进程名/可执行路径：scripts/ui_claim_traework.ps1（原默认是单引号字面量 '$env:APPDATA\\...\\TRAE SOLO CN.exe'，$ 不展开=恒假路径）、_task_traework.ps1、_task_traework_claim.ps1、run_traework_claim.py、agent_credit/ui_claim.py（TRAEWORK_PROCESS 显式透传 -ProcessName）。**额度：免费日额度已从 150 降为 100**（菜单文案「每日领100积分」，且 7 组「点击前/点击后」同分钟余额差实测均为 +100：10-06 2927→3027、10-07 3027→3127、10-08 3127→3227、10-09 3227→3327、10-10 3327→3427、10-11 3427→3527；对照 09-29 为 1677→1827 即 +150）。⚠️ 账本 09-30~10-11 共 12 天仍按 150 记账，合计虚记 600，待主人确认后回滚。【自动化路径，2026-09-28 起 claim_mode=ui】由每日计划任务跑 scripts/ui_claim_traework.ps1（OCR 定位+点击）；**非提权**——客户端由 RunLevel=Limited 计划任务拉起（中完整性），脚本同完整性即可驱动（UIPI 只拦 LOW→HIGH），2026-10-09 起不再 runas，别再弹 UAC。签完只关闭本次由脚本拉起的实例，主人已开着的保留。备用方案 run_traework_claim.py 仅作人工排查。共用端点 POST https://api.trae.cn/trae/api/v2/ug/checkin_credits/{status,claim}（body={req_source:1}）。【规则 2026-09-26 双方自述 + 官方页确认】会员 200/天，有效期 31 自然日（FIFO），每月登录赠 500 当月有效；**无连签周期、无连签加成**（官方「月最高 6200」= 200x31 纯线性，响应体无 streak 字段，只有 credits/extra_credits/beijingDayKey）。【为什么 UI 而非 external】鉴权头为 Authorization: Cloud-IDE-JWT <token>，token 只存在于 Electron 主进程内存（源自 %APPDATA%\\<产品>\\User\\globalStorage\\storage.json 里加密的 iCubeAuthInfo），按 research/SAFETY.md 禁止解密登录态 -> external 拿不到凭据；它自带定时任务（左栏「自动化」，须选本地环境）能定时唤起 agent，但 agent 在隔离 V8 无 fetch，只能靠电脑控制点击界面，且每次运行自身消耗积分，未必覆盖日收益，故未启用。入口：桌面端左下角账户条（新布局实测「用户71294228173免费」在 3868x2092 窗口下约 @58,1998）→ 点左侧头像/用户名开账户菜单（菜单向上展开，出口在窗口下方约 62% 高度处）。【OCR 脚本实测】scripts/ui_claim_traework.ps1（--explore 只抓布局 / --dry-run 只定位 / --shots 截图诊断）。四个实测坑：①入口文案不是「签到」，且 OCR 拆成单字（每/日/领/100/积/分）-> 必须连续词拼接匹配；②菜单是 toggle，多候选点轮流点击会互相关掉 -> 每点一次多轮检测，失败先 ESC 再换点；③入口行是说明文字，真按钮是右侧黑底白字「签到」（OCR 漏检黑底白字）-> 点文字行起点右偏（偏移由菜单右边界推算，窗口尺寸大变需重调，--shots 可快速重调）；④账户条上方有「升级会员」推广卡片，含「每日多领」字样，必须排除。已签态文案「今日已签」。失效条件：端点/鉴权变更、菜单文案服务端改版导致偏移失准、或客户端结构大改。【2026-10-13 合并后 UI 改版 & 判据换血】官宣合并后客户端 UI 大改，**账户条不再显示积分余额**（旧「用户71294228173 免费 3,527」-> 新「0用户71294228173免费」，且整行被 OCR 并成一条、words 是单字数组）-> 原「读账户条余额、看点击前后差额」的主判据整体失效，10-12/10-13 连续两天日志出现「复核余额 -1 -> -1」，成功判定退化成「今日已签」文案兜底。本次修复改用**卡片三态**（实测 OCR dump）：①未签：卡片常驻左侧栏底部，文案「每日领100积分」+「升级会员，每日多领100积分」，按钮 [签到][升级权益]；②刚领取：「今日签到，已获得100积分。下次可在头像菜单中签到。」，按钮 [今日已签(3s)]；③已签（稳定）：卡片整块换成会员推广「夺会员首月立减¥30 / 升级会员立即获得大额积分…」，按钮 [立即升级]，**页面上再无任何签到字样**。于是判据改为：主判据 = 正则抓「已获得N积分」取实发额度（比余额差更直接，且服务端调额时能自动跟上）；备用 = 余额差；兜底 = 文案（拿不到额度，退回 daily_amount）。幂等闸门 = 入口词「每日领」消失 + 会员推广态出现。按钮定位也从「像素扫药丸 + 4 个 offset 轮换」改为按 OCR 短文本在入口行下方定位（新布局里药丸扫描会扫到背景深色块，实测 x=664 len=235）。已用当日三态真实 OCR 文本做正则回归，无交叉误判（「升级会员立即获得大额积分」不会被误读成 granted）。【2026-10-15 两个误判实锤修复】① 三态结论③错了：**未签到时首页卡片同样可能是会员推广态**（签到入口只在头像菜单里，10-14 领取成功提示原文「下次可在头像菜单中签到」），首页见会员推广就判 already 会漏签——10-15 凌晨因此漏签（用户实机确认未到账）。已删该早退分支：首页无入口一律点头像菜单确认。② Find-AnyLine 已签词原是全窗口匹配，聊天面板里的 agent 对话文本含「今日已签」字样会造成**自指污染**误判 already（10-15 两次实锤，OCR dump 可见对话原文被当判据）。已给已签词判定加 x<30% 左侧栏限制（与入口词一致；「今日已签」按钮实测 @81,1622 在栏内）。补签实测：菜单路径点「签到」按钮，余额 3759→3859，[granted] 100。另注意：菜单里余额仍可读（菜单会话内 Find-Balance 有效，3759→3859 即菜单余额差），首页账户条才没有余额。【2026-10-19 积分明细查询通道打通：每包余额+过期时间可见】数据源实锤 = POST /trae/api/v2/pay/ide_user_ent_usage（body {require_usage:true, req_source}），响应 user_entitlement_pack_list[]，每包含 entitlement_base_info.{product_type, quota.credits_limit(-1=不限), end_time, status} + usage.credits_amount + 包级 expire_time/yearly_expire_time + display_desc —— 即「每条积分的剩余和过期时间」服务端本来就有，此前 validity 记 measured 31 天是因为没看过这个响应（audit 升级待首份真实 dump 复核）。调用方式 = 本地扩展 vendor/trae-credit-dump（装在 ~/.trae-cn/extensions/agent-credit.trae-credit-dump-0.0.1/，源码 vendor/trae-credit-dump/）：只 executeCommand 客户端自己注册的只读 getter（workbench.action.icubeGetCreditsUsageInfo[仅完整 IDE bundle] / icubeGetEntitlementInfo / icubeGetCheckinCreditsSnapshot / icubeGetFastRequestQuotaInfo / icubeGetIdeAccountManagementSnapshot），结果落 logs/trae_credit_detail.json；token 全程不落地、无解密、无注入、无额外服务端请求（getter 读客户端会话内缓存），符合 SAFETY 路线 2。客户端启动 15s 自动导一次，或命令面板「Agent Credit: 导出 Trae 积分明细」手动触发。解析登记：python scripts/trae_credit_detail.py（--record 走 credit.py set-balance trae <总剩余>）。已排除的旧判断要修正：①「余额只能靠 UI OCR」（SAFETY.md 5.1 表）对 Trae 不再成立——官方命令通道直接给结构化数据；②本地缓存确认无存档（state.vscdb/leveldb 仅 banner 标记），数据只在客户端内存，所以必须走扩展。失效条件：命令 id 改名/取消注册、ide_user_ent_usage 响应字段重命名、扩展目录扫描机制变化；UI 兜底 = 设置→用量管理页（icubeOpenUsageDetails 同一页）OCR。【2026-10-19 深夜跑通验证 + 重要修正】SOLO/Agent 窗口（windowType=Agent/Floating/TraeWork）**不加载用户扩展**：bundle 实锤 scanUserExtensions 在 mh(productService)=true 时直接 return []（日志原文 Skipping user extensions scan in solo-lite mode），extensions.json 即使扫出扩展也不激活。正路 = 开 IDE 窗口（windowType=IDE → 完整 workbench.desktop.main.js）：**实测入口 = SOLO 窗口右上角「IDE」按钮**（底层是 workbench.action.newIDEWindow / openIDEWindow；⚠️ SOLO-lite 无命令面板，Ctrl+Shift+P 无反应，文件菜单项未必露出，别走 palette/菜单），IDE 窗口启动 15s 扩展自动 dump。首份真实 dump（logs/trae_credit_detail.json）：creditsUsage 聚合 limit=3700 / used=133.66 / remaining=3566 / **expireTime=2026-10-31 23:59**；checkinSnapshot 当日已签(credits=100, extraCredits=100)。修正两点：①getEntitlementInfo() 不带参返回的是 pay status（commercial_activities/身份/开关），不含 user_entitlement_pack_list —— per-pack list 只在客户端拉 ide_user_ent_usage 后内存瞬时存在，getter 只暴露聚合；Free 单桶下聚合=每条，多包账号要 per-pack 需 UI 用量管理页兜底。②validity 由 measured 31 天升 **confirmed：客户端权威 expireTime=月底 23:59**（与 audit 行「无月度订阅费，只烧账上积分」一致）。当日验证流水：IDE 窗口 dump → python scripts/trae_credit_detail.py --record → set-balance trae 3566 已入账。【2026-10-19 深夜自动化】每日任务 action 改为 scripts/_daily_chain.ps1（checkin → trae_credit_sync.ps1）：sync 聚焦 Agent 窗发 Ctrl+Shift+N（newIDEWindow 内置快捷键 3116）开 IDE 窗 → 等 logs/trae_credit_detail.json 新鲜（扩展 v0.0.2 startup 15s/focus 5min 节流/30min 兜底）→ --record 登记 → WM_CLOSE 关 IDE 窗；一次性任务 scripts/_task_trae_credit_sync.ps1 实测 25s 全通（3541 入账）。⚠️ 本机任务计划怪癖新增两条：Register-ScheduledTask -Xml 静默丢第二个 Exec action（故用 chain 脚本包单 action）；非提权改任务静默 no-op/Access denied，换 action 必须提权跑一次 register-daily-task.ps1（2026-10-20 用户已提权跑通）。【2026-10-20 首夜实测 + 两处加固】凌晨 00:03 链路首跑：claim 成功（菜单 OCR 3532→3632 [granted] 100），但 sync 的 Ctrl+Shift+N 被吞（锁屏/焦点未到位）→ IDE 窗没开成，且旧逻辑拿昨天的 stale dump set-balance 3541 把真实余额覆盖成旧值。已修：①开 IDE 窗改为最多 3 轮重试（每轮重新聚焦 Agent 窗再发键，等 20s）；②**只有 dump 新鲜（mtime 晚于任务启动）才 --record**，否则 skip_record_stale 报错不碰台账。当日 00:12 手动补跑 25s 全绿，余额修正为 3629（=3632 扣当日 agent 消耗 3，与菜单 OCR 口径互洽）。残留风险：锁屏时 3 轮重试也可能全败，此时 sync 安全跳过，余额等次日凌晨或手动补跑刷新。【2026-10-20 接入通用对账契约 + 积分看板】Trae 现有 credits_command=python -m agent_credit.trae_credits --json，与 WorkBuddy 走同一条登记通道：台账里 Trae 从此有**真实到期日**（客户端展示的聚合到期日，实测 2026-10-31 23:59），不再是 25 条本地估算 + 4 条无到期日快照——没有到期日，「快过期先烧」这条规则对 Trae 是瞎的。新鲜度闸门按 beijingDayKey 判定：不是今天的 dump 一律拒绝登记（stale dump 会把签到后的真实余额覆盖成旧值，2026-10-20 踩过）。口径：结构化通道只给聚合 expireTime（客户端展示的最高优包到期日），免费单桶账号下即每笔到期日；逐包清单 user_entitlement_pack_list 只在「设置→用量管理」页渲染(icubeOpenUsageDetails)，结构化通道里没有，dump 里若出现就按包逐条登记(granularity=per_pack)，否则 aggregate。失效条件：扩展改名/改导出路径、checkinSnapshot.beijingDayKey 或 creditsUsage.expireTime 字段改名。【2026-10-23 凌晨跨夜漏签】客户端跨夜常驻时，头像菜单会残留上一日的「今日已签/本账号今日已签到，明日再来」，脚本据此误判 already，台账虚记 +100；同一时刻扩展 checkinSnapshot 仍为 checkedIn=false。补签：冷启动客户端后跑 scripts/_task_trae_claim.ps1 -Foreground（屏外模式的真实点击会被前台窗口遮挡），再跑 _task_trae_credit_sync.ps1 用新鲜 dump 对账。前台补签现有空闲闸门：-Foreground 默认最多等 300s、要求空闲 60s，用户活跃则返回 pending，不移动/点击窗口。"
