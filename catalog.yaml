  autoclaw:
    days: null
    confidence: measured
    evidence: "【2026-10-04 修正：不是 unknown，客户端本来就展示这个信息，之前没找对页面】从客户端明文 dist（resources/app/dist/renderer/assets/session-history-*.js）挖到完整结构：积分明细页路由 `/settings/credits`，是设置页的一个 leaf tab（渲染成 data-zwork-surface=\"settings/credits\"，导航项 data-settings-tab=\"credits\"，i18n creditsDetail.title = 「积分」）。i18n `creditsDetail.ledger.expiresAt`= 「{{date}} 到期」，流水结构 {id, description, occurredAt, expiresAt, amount, type}，其中 expiresAt 是 **Unix 秒级时间戳**（渲染时 new Date(e*1e3)）。**关键：积分分四类，各自的有效期规则独立**——daily(每日) / monthly(包月) / longTerm(长期) / campaign(活动)，服务端若下发 walletItems[] 则以其为准（key + displayName + balanceView）。所以「AutoClaw 有效期是多少天」这个问法本身不成立，必须按积分类型分别看；且「长期积分」的存在说明并非全部统一过期。validity_days 保持 null，因为四类规则不同、无法用单值表达。⚠️ 之前记的 unknown 是错的 —— 判unknown 的理由是「points/expiring 端点需解密登录态」，但读 UI 属于 research/SAFETY.md 的允许路线，根本不需要解密。另：UI 上「N积分将于 N 天内到期」是**滚动提示**（只显示最近一批剩余天数，历史 OCR 有「152 积分 3 天内到期」与「542 积分 3 天内到期」两条，数字在涨天数恒为 3），不能用它反推固定天数。"
  lobsterai:
    days: 30
    confidence: measured
    evidence: "asar i18n dailyCheckInValidityDays = 「有效期{days}天」，days 是**服务端变量**不是硬编码；字段结构为 context.state.rewardValidityDays + result.expiresAt。实测 UI 显示 30 天。服务端 slot 现返回 slotState=empty，拿不到 context，故 30 只能从 UI OCR 读"
  monkeycode_credit:
    days: null
    confidence: unknown
    evidence: "【2026-10-04 两轮核查后仍为 unknown，但已排除更多可能】① 接口层：GET /api/v1/users/wallet 只返回{id, balance, daily_token_balance, daily_token_limit}，**无任何有效期字段**；二进制（monkeycode-desktop.exe，Go 编译）里与积分相关的 API 路径只有/api/v1/users/wallet 和 /api/v1/users/wallet/checkin 两个，另探 records / transactions / detail / points 四个候选明细端点全 404；exe 里 validity 仅 3 处命中且全为无关（Go 运行时 / 证书吊销 / 打包的垃圾数据）。② UI 层：2026-10-04 实测走过「设置 → 账号」，页面只有三栏（今日额度 / 积分 / 已邀请），**没有积分明细或有效期入口**，「签到 +100」也没有附带任何期限说明。结论：这个字段既不在接口返回里，界面上也不展示，本地无从查证。维持 unknown 的理由不是「没找接口」，而是「客户端与 API 两侧都确认没有」。⚠️ 不要为此解密登录态去调captcha 链路（见 research/SAFETY.md 规则 1）。"
