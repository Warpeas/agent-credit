# 派单提供者配置
#
# 调度器不认识任何具体提供者：它只读这张表。
# - enabled: 是否参与调度（false = 完全跳过，便于临时停用）
# - priority: 越小越先试；失败且允许回退时自动试下一个
# - capabilities: 覆盖适配器默认能力声明；任务用 --capability 匹配
#
# 新增一个提供者：在 agent_credit/dispatch/adapters/ 下加一个模块（见 doc/adapter-contract.md），
# 然后在这里加一段配置即可，不需要改调度逻辑。
#
# 当前顺序（2026-11-15 定）：
#   codebuddy 10（hy4free，编码主力）→ loomy 20（每日额度）→ ollama 30（本地免费，
#   挡在额度紧张的三家前面）→ lobsterai 40 → qoder 50 → dumate 60（额度少，排最后）
# 注意：先按 --capability 取交集，再按 priority 排。loomy 没声明 code/review/test-gen，
# 这三类任务里它不会出现；code-gen 只有 ollama 声明。
#
# 派单主题（静态指令）：所有 provider 默认读 instructions/dispatch-theme.md，
# 由适配器用各家原生方式注入（codebuddy/qoder: --append-system-prompt，
# ollama: system 字段；loomy/dumate/lobsterai 无对应能力，见 doc/adapter-contract.md §11）。
# 单个 provider 可用 theme: <路径> 覆盖，theme: off 关闭；环境变量 AGENT_CREDIT_THEME 优先。

providers:
  ollama:
    enabled: true
    priority: 30
    capabilities:
      - text
      - commit
      - explain
      - code-gen
      - test-gen
    base_url: http://127.0.0.1:11434
    model: qwen3:8b-q4_K_M
    num_ctx: 8192
    num_predict: 600
    temperature: 0.2

  qoder:
    enabled: true
    priority: 50
    capabilities:
      - code
      - review
      - test-gen
      - commit
    binary: qoderclicn
    permission_mode: accept_edits

  lobsterai:
    enabled: true
    priority: 40
    capabilities:
      - text
      - code
      - review
      - commit
    binary: C:\Users\M4A1g\lobsterai\project\tools\lobster.cmd
    caller: agent-credit

  # hy4free 免费额度，作为编码主力。已知毛病：写 ~/.codebuddy/projects 失败时
  # 2~3 秒即退出、退出码仍为 0；codebuddy.py 按输出判失败并归一到 126，
  # 调度器不重试、立刻试下一个（判定依据见 doc/adapter-contract.md §10.3）。
  codebuddy:
    enabled: true
    priority: 10
    capabilities:
      - code
      - review
      - test-gen
      - commit
      - explain
    binary: codebuddy
    # headless 派单必须自动批准工具：acceptEdits 下它连 Bash/pytest 都要问，
    # 结果只回一句"需要授权"就当成功返回（2026-11-15 实测）。
    permission_mode: bypassPermissions
    # auto：直连优先。适配器给子进程注入 CODEBUDDY_CONFIG_DIR=<data>/codebuddy-home，
    # 不再写家目录；直连若因写盘/启动失败（归一化 126/127）自动回落队列。
    # direct 只直连；queue 只队列。队列作为兜底保留，不删除。
    transport: auto
    queue_fallback: true
    task_name: agent-credit-codebuddy
    poll_interval_s: 2
    retrigger_s: 10

  # DuMate 走自带 opencode 运行时的本地 HTTP 链路（无独立 CLI）。模型请求仍由
  # DuMate 自己的本地网关发出，真实消耗个人额度；余额无公开接口，按未知处理。
  dumate:
    enabled: true
    priority: 60
    capabilities:
      - text
      - code
      - review
      - test-gen
      - commit
      - explain
    # binary / config_dir 默认自动发现；需要固定路径时再取消下面两行的注释。
    # binary: C:\Users\M4A1g\AppData\Local\Programs\DuMate\resources\extra-resource\opencode\bin\dumate-opencode.exe
    # config_dir: C:\Users\M4A1g\AppData\Roaming\qianfan-desktop-app\qianfan_desk_xdg\<userId>\config
    startup_timeout_s: 45

  # Loomy 走本机任务箱通道（无官方 CLI/网关；worker = skill「跑任务箱」）。
  # preflight 会查 Loomy 进程与 worker 心跳，客户端没开或心跳超过 15 分钟就如实
  # 报不可用并回退——所以第二顺位只有在 worker 真的在跑时才生效，不是配了就自动能用。
  # office/search 是它的独占标签（别家适配器不声明）；text/commit/explain 也参与
  # 通用链，排在 codebuddy 之后。
  # ⚠️ yaml_lite 不支持行内注释，注释一律写在独立行（2026-11-15 踩坑）。
  loomy:
    enabled: true
    priority: 20
    capabilities:
      - office
      - search
      - text
      - commit
      - explain
    # 任务箱目录（相对仓库根，可写绝对路径）
    taskbox: data/loomy-taskbox
    # 派单后轮询结果的间隔
    poll_interval_s: 2
    # worker 心跳超过 15 分钟视为不活跃，preflight 拒单。
    # 这个值必须 ≥ 3 倍唤醒间隔（当前 300s × 3），否则会出现「日级调度配 30 分钟阈值」那种自废组合。
    heartbeat_max_age_s: 900
    # 外部唤醒源间隔（scripts/loomy-wake.py + Windows 计划任务 agent-credit-loomy-wake）。
    # Loomy 官方定时任务只有 daily/weekly，没有分钟级；这个脚本复用它的调度桥来补 5 分钟一次。
    wake_interval_s: 300
    # preflight 用它显示「下次消费约 HH:MM:SS」，把「真不可用」和「还没到点」区分开
    wake_state: data/loomy-wake-state.json
    # preflight 用 tasklist 查这些进程名
    process_names:
      - Loomy

  # ToDesk AI 走桌面客户端的 GUI 键鼠通道（无 CLI、无对外 API；内部 8909 是私有 RPC，
  # 凭据在 Program Files 的 config.ini 里，复用等于踩契约 §9.1/§9.2，故不做）。
  # 实现要点：Tauri/WebView2 下 UIA 读不到输入框和正文，所以用官方全局快捷键 + 剪贴板
  # 输入，用「让 AI 把结果写文件」回传（data/todesk-taskbox/*.out.md）。
  # 额度按积分计（500/天、当天过期），客户端不返回用量 → supports_balance=False，
  # 每次事件的 usage 都是 status=failed（契约 §7.2 允许）。
  # 会抢焦点、单实例，所以排在链尾兜底：其它 provider 全失败或全部不可用时才用它。
  todesk:
    enabled: true
    priority: 90
    capabilities:
      - text
      - office
      - explain
    exe: "C:\Program Files\ToDesk AI\ToDeskAI.exe"
    # 结果回传目录（相对路径按仓库根解析）
    taskbox: data/todesk-taskbox
    # 官方全局快捷键：Alt+Space 唤起主界面，Ctrl+Alt+N 新建会话
    wake_hotkey: alt+space
    new_session_hotkey: ctrl+alt+n
    # 单次派单最长等待（s）；超时记 124
    answer_timeout_s: 240
    # 抢屏保护：用户最近这么多秒内有键鼠输入就不派单（0 = 关闭保护）
    require_idle_s: 60
    poll_interval_s: 1.0
